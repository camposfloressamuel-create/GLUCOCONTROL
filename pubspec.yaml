name: glucocontrol
description: "GlucoControl - Tu glucosa bajo control, todos los días. Aplicación Android gratuita y sin conexión para el registro y seguimiento de glucosa y salud."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  fl_chart: ^0.69.2
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: '>=0.19.0 <0.21.0'
  file_picker: ^8.1.4
  share_plus: ^10.1.2

dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  assets:
    - assets/images/glucocontrol_logo.png
